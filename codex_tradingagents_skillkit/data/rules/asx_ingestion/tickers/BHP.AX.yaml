  preferred_document_roles:
    - annual_report
    - results_presentation
    - appendix_4e
    - financial_report_pdf
  preferred_document_types:
    - Annual Report
    - Full Year Results
    - Appendix 4E / Preliminary Final Report
    - Operational Review
  document_type_hints:
    - pattern: "operational\\s+review|operations\\s+review"
      document_type: "Full Year Results"
    - pattern: "fy\\s?25.*results|full[- ]year.*results"
      document_type: "Full Year Results"
