ticker: CBA.AX
plugin_version: 1
source_hints:
  official_urls:
    - https://www.commbank.com.au/about-us/investors.html
  fallback_page_urls:
    - https://www.commbank.com.au/about-us/investors/financial-results.html
  preferred_document_roles:
    - annual_report
    - appendix_4e
    - financial_report_pdf
  preferred_document_types:
    - Annual Report
    - Appendix 4E / Preliminary Final Report
preferred_sections:
  - financial highlights
  - key ratios
  - performance summary
  - credit quality
  - delivering financial performance
reject_sections:
  - peer comparison
  - market capitalisation
  - market capitalization
  - remuneration
  - climate disclosures
  - financed emissions
metrics:
  net_interest_margin:
    accepted_labels:
      - net interest margin
      - NIM
    preferred_sections:
      - financial highlights
      - key ratios
      - performance summary
    direct_value_patterns:
      - "\\b\\d+(?:\\.\\d+)?\\s*%\\s+Net interest margin\\b"
      - "\\bNet interest margin\\s+\\d+(?:\\.\\d+)?\\s*%\\b"
    value_validation:
      ranges:
        - units: ["%"]
          min: 0
          max: 10
        - units: ["bps"]
          min: -500
          max: 500
    rejected_nearby_terms:
      - operating income
      - cash NPAT
      - dividend
      - CET1
    reject_contexts:
      - operating income
  cet1:
    accepted_labels:
